server:
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:h2:file:./data/foodmarks;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
app:
  google-key: ${GOOGLE_GEOCODING_KEY:}
  cors-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodmarks}
    username: ${DB_USER:foodmarks}
    password: ${DB_PASSWORD:foodmarks}
