name: foodmarks
description: SNS에서 발견한 맛집을 모으는 Flutter 학습 앱
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  http: ^1.6.0
  google_maps_flutter: ^2.19.0
  url_launcher: ^6.3.2
  pointer_interceptor: ^0.10.1+3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
